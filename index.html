<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kazanım Defteri 2026-2027 · Mehtap BİNİCİ</title>
<meta name="theme-color" content="#1d3557">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kazanım Defteri">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js" defer></script>
<style>
:root{
  --paper:#fdfbf4; --line:#c9dcea; --margin-red:#e35d5d; --ink:#1d3557; --ink-soft:#4a6584;
  --tema:#2a6f4e; --gold:#c9a227; --card:#ffffff;
  --ciyi:#2a6f4e; --iyi:#2266aa; --orta:#9a7a10; --vasat:#c83c3c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(150px + env(safe-area-inset-top,0px))}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px),var(--paper);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 90px;position:relative}
.wrap::before{content:"";position:fixed;top:0;bottom:0;left:max(6px,calc(50% - 470px));width:2px;background:var(--margin-red);opacity:.5;pointer-events:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}

/* Üst sabit bölge */
.ust{
  position:sticky;top:0;z-index:20;margin:0 -14px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  background:rgba(253,251,244,.96);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-bottom:1.5px solid var(--line);
}
.baslik{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
h1{font-family:'Caveat',cursive;font-size:2.1rem;line-height:1;color:var(--ink)}
h1 span{color:var(--margin-red)}
.yil{font-size:.8rem;font-weight:800;color:var(--ink-soft);white-space:nowrap}
.dersler{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.dersler::-webkit-scrollbar{display:none}
.ders-btn{
  flex:1 0 auto;padding:10px 14px;border-radius:12px;font-weight:800;font-size:.92rem;
  border:1.5px solid var(--ink);color:var(--ink);background:#fff;white-space:nowrap;min-height:44px;
}
.ders-btn[aria-pressed="true"]{background:var(--ink);color:#fff}
.subeler{display:flex;gap:6px;margin-top:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.subeler::-webkit-scrollbar{display:none}
.sube-btn{
  padding:6px 14px;border-radius:20px;font-weight:800;font-size:.9rem;min-height:36px;
  background:#fff;border:1.5px solid var(--line);color:var(--ink-soft);white-space:nowrap;
}
.sube-btn[aria-pressed="true"]{border-color:var(--margin-red);color:var(--margin-red);background:#fdf0f0}
.sube-ekle{border-style:dashed}
.arama{margin-top:8px;display:flex;gap:6px}
.arama input{
  flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:16px;background:#fff;color:var(--ink);
}
.arama input:focus{outline:none;border-color:var(--ink)}
.kucuk-btn{padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:.8rem;color:var(--ink-soft);min-height:44px}

/* Bu hafta */
.bu-hafta{
  margin-top:14px;background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;
  display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;text-align:left;
}
.bu-hafta .etiket{font-family:'Caveat',cursive;font-size:1.25rem;color:#ffd97a;line-height:1}
.bu-hafta .ad{font-weight:800;font-size:1.05rem;margin-top:2px}
.bu-hafta .alt{font-size:.8rem;opacity:.8;margin-top:2px}
.bu-hafta .git{margin-left:auto;font-size:1.4rem;opacity:.8}
.duyuru{margin-top:8px;background:#fff8e1;border:1.5px solid #f0d98a;border-radius:10px;padding:8px 12px;font-size:.82rem;font-weight:700;color:#7a5c00}

/* İlerleme */
.ilerleme{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:.82rem;font-weight:800;color:var(--ink-soft)}
.bar{flex:1;height:8px;background:#e4ecf3;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tema);border-radius:6px;transition:width .3s}

/* Tema kartları */
#liste{margin-top:14px}
.tema{background:var(--card);border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 6px rgba(29,53,87,.08);border-left:6px solid var(--tema)}
.tema-head{display:flex;align-items:center;gap:10px;padding:14px 14px;cursor:pointer;user-select:none;width:100%;text-align:left}
.tema-head h2{font-family:'Caveat',cursive;font-size:1.6rem;color:var(--tema);flex:1;line-height:1.05}
.badge{background:#eef4ef;color:var(--tema);font-size:.74rem;font-weight:800;padding:4px 9px;border-radius:20px;white-space:nowrap}
.chev{transition:transform .2s;color:var(--ink-soft);font-size:.8rem}
.open>.tema-head .chev,.metin.open>.metin-head .chev{transform:rotate(90deg)}
.tema-body{display:none;padding:0 10px 10px}
.open>.tema-body{display:block}

.metin{border:1.5px solid #e4ecf3;border-radius:12px;margin-bottom:8px;background:#fff;overflow:hidden}
.metin.simdi{border-color:var(--gold);box-shadow:0 0 0 2px #f6e7b0}
.metin-head{display:flex;align-items:center;gap:8px;padding:12px;cursor:pointer;user-select:none;width:100%;text-align:left;min-height:52px}
.metin-head .ad{font-weight:800;flex:1;line-height:1.3}
.metin-head .ad small{display:block;font-weight:700;color:var(--ink-soft);font-size:.74rem;margin-top:2px}
.tarih{font-size:.74rem;font-weight:800;color:#fff;background:var(--margin-red);padding:3px 9px;border-radius:16px;white-space:nowrap}
.metin.gecti .tarih{background:#9fb0c0}
.sayac{font-size:.72rem;font-weight:800;color:var(--tema);white-space:nowrap}
.metin-body{display:none;padding:2px 12px 12px;border-top:1px dashed var(--line)}
.metin.open .metin-body{display:block}

.eylemler{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.eylem{padding:8px 12px;border-radius:10px;font-weight:800;font-size:.8rem;border:1.5px solid var(--ink);color:var(--ink);background:#fff;min-height:40px}
.eylem.dolu{background:var(--ink);color:#fff}

.alan{margin-top:12px}
.alan h4{font-size:.82rem;font-weight:800;color:var(--ink-soft);border-bottom:1.5px solid var(--line);padding-bottom:4px;margin-bottom:4px}
.kaz{padding:8px 6px;border-radius:10px;margin:0 -6px}
.kaz.islendi{background:#f2f8f4}
.kaz-ust{display:flex;gap:10px;align-items:flex-start;cursor:pointer;width:100%;text-align:left;font-size:.93rem;line-height:1.45}
.kutu{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid #9fb0c0;margin-top:1px;display:grid;place-items:center;color:#fff;font-size:.9rem;font-weight:900;background:#fff}
.kaz.islendi .kutu{background:var(--tema);border-color:var(--tema)}
.kod{font-weight:800;color:var(--margin-red);background:#fdf0f0;border-radius:6px;padding:0 6px;font-size:.8rem;margin-right:4px;white-space:nowrap}
.duzey{display:none;gap:5px;margin:8px 0 0 34px;flex-wrap:wrap}
.kaz.islendi .duzey{display:flex}
.dz{padding:6px 10px;border-radius:18px;font-size:.78rem;font-weight:800;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);min-height:34px}
.dz[aria-pressed="true"][data-v="Çok İyi"]{background:var(--ciyi);border-color:var(--ciyi);color:#fff}
.dz[aria-pressed="true"][data-v="İyi"]{background:var(--iyi);border-color:var(--iyi);color:#fff}
.dz[aria-pressed="true"][data-v="Orta"]{background:var(--gold);border-color:var(--gold);color:#fff}
.dz[aria-pressed="true"][data-v="Vasat"]{background:var(--vasat);border-color:var(--vasat);color:#fff}

details.ek{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
details.ek summary{font-weight:800;font-size:.85rem;color:var(--ink-soft);cursor:pointer;padding:6px 0;list-style:none}
details.ek summary::before{content:"＋ "}
details.ek[open] summary::before{content:"－ "}
.ek-blok{margin-top:8px;font-size:.85rem;line-height:1.5}
.ek-blok b{display:block;font-size:.78rem;color:var(--tema);margin-bottom:2px}
.ek-blok p{white-space:pre-line}
.not{margin-top:10px;background:#fffdf5;border-left:4px solid var(--gold);padding:8px 10px;border-radius:6px;font-size:.82rem;font-weight:700;color:#6b5510}

/* Rapor */
.rapor-panel{margin-top:26px;background:var(--card);border-radius:14px;padding:16px;box-shadow:0 2px 6px rgba(29,53,87,.08);border-left:6px solid var(--gold)}
.rapor-panel h2{font-family:'Caveat',cursive;font-size:1.7rem;color:#9a7a10}
.rapor-panel p{color:var(--ink-soft);font-size:.85rem;margin:4px 0 12px}
.ay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ay-btn{font-weight:800;font-size:.9rem;border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;background:#fbfdff;color:var(--ink);text-align:center;min-height:56px}
.ay-btn .sayi{display:block;font-size:.72rem;color:var(--ink-soft);font-weight:700;margin-top:2px}

footer{margin-top:28px;text-align:center;font-size:.8rem;color:var(--ink-soft);line-height:1.6}
footer .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.bos{text-align:center;padding:30px 16px;color:var(--ink-soft);background:var(--card);border-radius:14px;font-weight:700}

/* Alt sayfa (şube yönetimi, rapor paylaşımı) */
.perde{position:fixed;inset:0;background:rgba(29,53,87,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sayfa{background:var(--paper);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sayfa h3{font-family:'Caveat',cursive;font-size:1.7rem;margin-bottom:8px}
.sayfa .satir{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-weight:800}
.sayfa .satir span{flex:1}
.sayfa input{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:16px}
.ana-btn{padding:12px 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;min-height:46px}
.ikinci-btn{padding:12px 16px;border-radius:12px;border:1.5px solid var(--ink);color:var(--ink);font-weight:800;min-height:46px;background:#fff}
.sil-btn{color:var(--margin-red);font-weight:800;padding:8px 10px}
.sayfa .alt-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sayfa .alt-row>*{flex:1}


/* Sınıf sekmeleri */
.siniflar{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.siniflar::-webkit-scrollbar{display:none}
.sinif-btn{flex:1 0 auto;padding:10px 16px;border-radius:12px;font-weight:800;font-size:1rem;border:1.5px solid var(--ink);color:var(--ink);background:#fff;white-space:nowrap;min-height:46px}
.sinif-btn[aria-pressed="true"]{background:var(--ink);color:#fff}
.sinif-duzenle{flex:0 0 auto;border-style:dashed;border-color:var(--ink-soft);color:var(--ink-soft);font-size:.85rem}
.ders-baslik{display:flex;align-items:center;gap:10px;margin-top:10px}
.geri{flex:0 0 auto;min-width:46px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:1.5rem;font-weight:800;color:var(--ink)}
.ders-baslik b{display:block;font-size:1.05rem;line-height:1.2}
.ders-baslik small{display:block;font-size:.78rem;color:var(--ink-soft);font-weight:700}
/* Ders kartları */
.ders-kart{display:block;width:100%;text-align:left;background:var(--card);border-radius:14px;margin-top:12px;padding:16px;box-shadow:0 2px 6px rgba(29,53,87,.08);border-left:6px solid var(--tema)}
.ders-kart h2{font-family:'Caveat',cursive;font-size:1.75rem;color:var(--tema);line-height:1.05;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ders-kart h2 span{font-family:'Nunito',sans-serif;font-size:1.3rem;color:var(--ink-soft)}
.ders-kart .hafta{margin-top:8px;font-size:.88rem;font-weight:700;line-height:1.4}
.ders-kart .hafta em{font-style:normal;color:var(--margin-red);font-weight:800}
.ders-kart .ilerleme{margin-top:10px}
.ders-kart.bekliyor{border-left-color:#b9c6d2;opacity:.75}
.ders-kart.bekliyor h2{color:var(--ink-soft)}
.sec-satir{display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:700;min-height:44px}
.sec-satir input{width:22px;height:22px;accent-color:var(--tema);flex:0 0 auto}
.sinif-grup{border-bottom:1px dashed var(--line);padding:8px 0}
.sinif-grup .ust-satir{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:1.05rem}

.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90vw;text-align:center;font-size:.9rem}
.toast.show{opacity:1}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){h1{font-size:2.5rem}.ders-btn{flex:0 0 auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="ust">
    <div class="baslik">
      <h1>Kazanım <span>Defteri</span></h1>
      <div class="yil">2026-2027</div>
    </div>
    <div class="siniflar" id="siniflar" role="group" aria-label="Sınıf"></div>
    <div class="ders-baslik hidden" id="dersBaslik">
      <button class="geri" id="geri" type="button" aria-label="Derslere dön">‹</button>
      <div><b id="dersAd"></b><small id="dersAlt"></small></div>
    </div>
    <div class="arama hidden" id="aramaSatir">
      <input type="search" id="ara" placeholder="Metin veya kod ara" autocomplete="off">
      <button class="kucuk-btn" id="hepsiniAc" type="button">Aç</button>
    </div>
  </div>

  <div id="duyurular"></div>
  <div id="dersSecim"></div>
  <div id="dersEkran" class="hidden">
  <button class="bu-hafta hidden" id="buHafta" type="button"></button>
  <div class="ilerleme" id="ilerleme"></div>
  <div id="liste"></div>

  <div class="rapor-panel">
    <h2>Aylık Maarif Raporu</h2>
    <p id="raporAciklama"></p>
    <div class="ay-grid" id="ayGrid"></div>
  </div>
  </div>

  <footer>
    Özel İdare Ortaokulu · <span id="ogrAd"></span><br>
    Kayıtlar yalnızca bu cihazda tutulur. Telefon değiştirmeden önce yedek alın.
    <div class="row">
      <button class="kucuk-btn" id="yedekAl" type="button">Yedek al</button>
      <button class="kucuk-btn" id="yedekYukle" type="button">Yedeği yükle</button>
      <input type="file" id="yedekDosya" accept=".json,application/json" class="hidden">
    </div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="perdeKok"></div>

 Yolculuğu başlıklı kısa bir dijital içerik, poster veya sunum hazırlayabilirler.","okul":"","gunler":"İLKÖĞRETİM HAFTASI","saat":8},{"ad":"Türkçenin Beyliği","tarih":"23-30 Eylül","bas":"2026-09-23","bit":"2026-09-30","aylar":["Eylül"],"kazanimlar":[{"kod":"T.D.6.1","metin":"Dinlemede/izlemede materyal seçimini yönetebilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.4","metin":"Dinlediğinde/izlediğinde geçen anlamını bilmediği söz varlığı unsurlarının anlamını tahmin edebilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.5","metin":"Dinlediğinin/izlediğinin yüzey anlamını belirleyebilme","alan":"Dinleme/İzleme"},{"kod":"T.O.6.16","metin":"Bilgilendirici metinde anahtar kelimeleri belirlemeye yönelik çözümleme yapabilme","alan":"Okuma"},{"kod":"T.D.6.19","metin":"Dinlediğinden/izlediğinden hareketle söz varlığını geliştirmeye yönelik çözümleme yapabilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.25","metin":"Dinleme/izleme sürecine yönelik öz yansıtma yapabilme/kendini uyarlayabilme","alan":"Dinleme/İzleme"},{"kod":"T.O.6.1","metin":"Okumada materyal seçimini yönetebilme","alan":"Okuma"},{"kod":"T.O.6.2","metin":"Sesli ve sessiz okurken akıcı okuma unsurlarını yönetebilme","alan":"Okuma"},{"kod":"T.O.6.4","metin":"Okuyacağı metnin içeriğine yönelik tahminde bulunabilme","alan":"Okuma"},{"kod":"T.O.6.5","metin":"Metinde geçen anlamını bilmediği söz varlığı unsurlarının anlamını tahmin edebilme","alan":"Okuma"},{"kod":"T.O.6.6","metin":"Metnin yüzey anlamını belirleyebilme","alan":"Okuma"},{"kod":"T.O.6.16","metin":"Bilgilendirici metinde anahtar kelimeleri belirlemeye yönelik çözümleme yapabilme","alan":"Okuma"},{"kod":"T.O.6.21","metin":"Metinden hareketle söz varlığını geliştirmeye yönelik çözümleme yapabilme","alan":"Okuma"},{"kod":"T.O.6.27","metin":"Okuma sürecine yönelik öz yansıtma yapabilme/kendini uyarlayabilme","alan":"Okuma"},{"kod":"T.K.6.1","metin":"Konuşma sürecini yönetebilme","alan":"Konuşma"},{"kod":"T.K.6.22","metin":"Konuşmasını zenginleştirecek biçimde söz var amını bilmediği söz varlığı unsurlarının anlamını tahmin edebilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.5","metin":"Dinlediğinin/izlediğinin yüzey anlamını belirleyebilme","alan":"Dinleme/İzleme"},{"kod":"T.O.6.16","metin":"Bilgilendirici metinde anahtar kelimeleri belirlemeye yönelik çözümleme yapabilme","alan":"Okuma"},{"kod":"T.D.6.19","metin":"Dinlediğinden/izlediğinden hareketle söz varlığını geliştirmeye yönelik çözümleme yapabilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.25","metin":"Dinleme/izleme sürecine yönelik öz yansıtma yapabilme/kendini uyarlayabilme","alan":"Dinleme/İzleme"},{"kod":"T.O.6.1","metin":"Okumada materyal seçimini yönetebilme","alan":"Okuma"},{"kod":"T.O.6.2","metin":"Sesli ve sessiz okurken akıcı okuma unsurlarını yönetebilme","alan":"Okuma"},{"kod":"T.O.6.4","metin":"Okuyacağı metnin içeriğine yönelik tahminde bulunabilme","alan":"Okuma"},{"kod":"T.O.6.5","metin":"Metinde geçen anlamını bilmediği söz varlığı unsurlarının anlamını tahmin edebilme","alan":"Okuma"},{"kod":"T.O.6.6","metin":"Metnin yüzey anlamını belirleyebilme","alan":"Okuma"},{"kod":"T.O.6.16","metin":"Bilgilendirici metinde anahtar kelimeleri belirlemeye yönelik çözümleme yapabilme","alan":"Okuma"},{"kod":"T.O.6.21","metin":"Metinden hareketle söz varlığını geliştirmeye yönelik çözümleme yapabilme","alan":"Okuma"},{"kod":"T.O.6.27","metin":"Okuma sürecine yönelik öz yansıtma yapabilme/kendini uyarlayabilme","alan":"Okuma"},{"kod":"T.K.6.1","metin":"Konuşma sürecini yönetebilme","alan":"Konuşma"},{"kod":"T.K.6.22","metin":"Konuşmasını zenginleştirecek biçimde söz varlığını kullanabilme","alan":"Konuşma"},{"kod":"T.K.6.26","metin":"Konuşma sürecine yönelik öz yansıtma yapabilme/kendini uyarlayabilme","alan":"Konuşma"},{"kod":"T.Y.6.1","metin":"Yazma sürecini yönetebilme","alan":"Yazma"},{"kod":"T.Y.6.18","metin":"Yazısını zenginleştirecek biçimde söz varlığını kullanabilme","alan":"Yazma"},{"kod":"T.Y.6.21","metin":"Yazım kuralları ve noktalama işaretlerini uygulayabilme","alan":"Yazma"},{"kod":"T.Y.6.22","metin":"Yazma sürecine yönelik öz yansıtma yapabilme/kendini uyarlayabilme","alan":"Yazma"}],"kanit":"Sözlü sunum becerisi: Türkçenin gelişimine katkıda bulunan bir şahsiyet gibi kendini tanıtma sunumları, dereceli puanlama anahtarı ile değerlendirilebilir. Yazılı dil bilgisi: Virgülün kullanım alanlarını belirleme ve cümleleri gruplandırma becerisi, kontrol listesi ile ölçülebilir. Yazma ve öz değerlendirme: Yazılan metnin puan çizelgesi kullanılarak değerlendirilmesi, öz değerlendirme formu ile ölçülebilir.","degerler":"D4. Dostluk, D7. Estetik, D14. Saygı, D16. Sorumluluk, D19. Vatanseverlik","farklilastirma":"Destekleme: Metinde anlamı bilinmeyen veya öğrencilerin anlamlandırmakta zorlandığı kelime ve ifadeler belirlenerek bunların bağlam içerisindeki anlamları üzerinde çalışılabilir. Öğrencilerden seçilen kelimeleri yeni cümlelerde kullanmaları istenebilir. Metnin iletisini ortaya çıkarmak amacıyla anahtar kelimelerden hareketle kısa soru-cevap çalışmaları yapılabilir. Zenginleştirme: Öğrenciler günlük yaşamda, sosyal medyada, reklamlarda ve mağaza adlarında karşılaştıkları yabancı sözcüklerden örnekler toplayarak bunların Türkçe karşılıklarını araştırabilirler. Elde edilen örneklerden hareketle “Türkçesi Varken” başlıklı sınıf panosu, dijital sözlük veya farkındalık çalışması hazırlanabilir. İleri düzey çalışma yapmak isteyen öğrenciler Türk Dil Kurumunun yabancı kelimelere önerdiği Türkçe karşılıklardan örnekler araştırarak bunların günlük dilde kullanılma durumları üzerine küçük bir anket gerçekleştirebilirler.","okul":"1. Tema - Dilimizin Zenginliği: “Söz Varlığımızın İzinde”(3 saat) • Araştırma: Öğrenciler Türkçenin söz varlığını oluşturan atasözleri, deyimler, kalıp sözler, yöresel kelimeler ve günlük yaşamda kullanılan farklı ifadeler üzerine araştırma yaparlar. Aile büyüklerinden veya yakın çevrelerinden artık daha az kullanılan kelime ve sözleri öğrenerek bunların anlamlarını araştırırlar. Gözlem: Öğrenciler günlük yaşamda, aile içinde, okulda ve çevrelerinde kullanılan kelime ve ifadeleri gözlemlerler. Daha önce duymadıkları, anlamını merak ettikleri veya dikkatlerini çeken kelimeleri not ederek küçük bir “Kelime Hazinem” listesi oluştururlar.* Okuma Etkinlikleri: Tema metinlerinden hareketle Türkçenin söz varlığı üzerinde durulur. Metinlerde karşılaşılan deyimler, atasözleri, kalıp sözler ve dikkat çekici kelimeler belirlenir; bunların metne kattığı anlam üzerinde konuşulur. Öğrenciler farklı edebî metinlerden de yeni kelimeler keşfetmeye teşvik edilir. • Proje: Öğrenciler araştırma, gözlem ve okuma çalışmalarından topladıkları kelime ve ifadelerden hareketle “Dilimizin Zenginliği Sözlüğü” hazırlarlar. Çalışmada kelimenin anlamına, kullanıldığı bir cümleye ve mümkünse kimden veya nereden öğrenildiğine yer verilir. Ürün; sınıf sözlüğü, kelime kartları, poster veya dijital sözlük biçiminde hazırlanabilir. • Sosyal Etkinlik: Sınıfta “Kelime Hazinemiz” etkinliği düzenlenir. Öğrenciler seçtikleri ilginç kelime, deyim veya atasözlerini arkadaşlarına tanıtırlar. Çalışmalardan sınıf veya okul koridorunda bir “Dilimizin Zenginliği Köşesi” oluşturulabilir","gunler":"","saat":8},{"ad":"Türk Dil Kurumu Sunar","tarih":"12-20 Ekim","bas":"2026-10-12","bit":"2026-10-20","aylar":["Ekim"],"kazanimlar":[{"kod":"T.D.6.1","metin":"Dinlemede/izlemede materyal seçimini yönetebilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.4","metin":"Dinlediğinde/izlediğinde geçen anlamını bilmediği söz varlığı unsurlarının anlamını tahmin edebilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.5","metin":"Dinlediğinin/izlediğinin yüzey anlamını belirleyebilme","alan":"Dinleme/İzleme"},{"kod":"T.O.6.16","metin":"Bilgilendirici metinde anahtar kelimeleri belirlemeye yönelik çözümleme yapabilme","alan":"Okuma"},{"kod":"T.D.6.19","metin":"Dinlediğinden/izlediğinden hareketle söz varlığını geliştirmeye yönelik çözümleme yapabilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.25","metin":"Dinleme/izleme sürecine yönelik öz yansıtma y n dinleme sürecine ne kadar aktif katıldığını kontrol etmeye yardımcı olur.","degerler":"D4. Dostluk, D7. Estetik, D14. Saygı, D16. Sorumluluk, D19. Vatanseverlik","farklilastirma":"Destekleme: Dinleme/izleme öncesinde içerikte karşılaşılabilecek temel kavramlar öğrencilere verilerek tahmin çalışması yapılabilir. Dinleme sırasında “Ne biliyordum? Ne öğrendim? Merak ettiğim ne kaldı?” bölümlerinden oluşan basit bir takip formu kullanılabilir. İçerikte verilen bilgilerin oluş sırasına göre düzenlenmesi de istenebilir. Zenginleştirme: Öğrenciler günlük hayatta kullandıkları bir eşyanın adının kökenini araştırarak “Bir Sözcüğün Hikâyesi” çalışması hazırlayabilirler. Elde ettikleri bilgileri kısa video, ses kaydı, infografik veya sınıf sunumu biçiminde paylaşabilirler. Sınıfça yapılan çalışmalar bir araya getirilerek 6. Sınıf Kelime Hazinesi adıyla küçük bir dijital veya basılı sözlük oluşturulabilir.","okul":"“LO” isimli kitap (Şermin YASAR) okunup değerlendirilecek. 21-22-23 EKİM ÜRETİM ZAMANI YAZMA VE KONUŞMA ETKİNLİKLERİ YAPILACAK. 1. TEMA DEĞERLENDİRME YAPILACAK","gunler":"","saat":8}]},{"tema":"Bağımsızlık Yolu","metinler":[{"ad":"Cepheye Koşan At","tarih":"26 Ekim - 3 Kasım","bas":"2026-10-26","bit":"2026-11-03","aylar":["Ekim","Kasım"],"kazanimlar":[{"kod":"T.D.6.2","metin":"Dinlemede/izlemede strateji ve yöntem seçimlerini yönetebilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.3","metin":"Dinleyeceğinin/izleyeceğinin içeriğine yönelik tahminde bulunabilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.6","metin":"Görselle iletilen anlamı belirleyebilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.7","metin":"Dinlediğinin/izlediğinin derin anlamını belirlemeye yönelik basit çıkarımlar yapabilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.8","metin":"Dinlediğinin/izlediğinin derin anlamını belirlemeye yönelik üst düzey çıkarımlar yapabilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.9","metin":"Dinlediğini/izlediğini kendi içinde karşılaştırabilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6 cı yazı yazabilme","alan":"Yazma"},{"kod":"T.Y.6.9","metin":"Yazısında karşılaştırma yapabilme","alan":"Yazma"},{"kod":"T.Y.6.10","metin":"Yazısında sınıflandırma yapabilme","alan":"Yazma"},{"kod":"T.Y.6.17","metin":"Yazısında düşünceyi geliştirme yollarını kullanabilme","alan":"Yazma"},{"kod":"T.Y.6.21","metin":"Yazım kuralları ve noktalama işaretlerini uygulayabilme","alan":"Yazma"},{"kod":"T.Y.6.22","metin":"Yazma sürecine yönelik öz yansıtma yapabilme/kendini uyarlayabilme","alan":"Yazma"}],"kanit":"Sözlü Anlatım ve Sunum: Farklı ülkelerin görgü kuralları ve halk dansları gibi kültürel unsurları hakkında sunum yapma becerisi, dereceli puanlama anahtarı ile değerlendirilebilir. Araştırma ve Özetleme: Seçilen bir ülkenin kültürel ögelerini (geleneksel yemek, dans vb.) araştırıp özetleme becerisi, kontrol listesi ile ölçülebilir.","degerler":"D4. Dostluk, D7. Estetik, D14. Saygı, D19. Vatanseverlik","farklilastirma":"Destekleme: Üç ülkeye ilişkin temel bilgiler ülke-kültür-yaşam biçimi başlıklarından oluşan karşılaştırma tablosuna yerleştirilebilir. Harita ve görsellerden yararlanılarak öğrencilerin metindeki bilgileri somutlaştırmaları sağlanabilir. Zenginleştirme: Öğrenciler metinde yer almayan bir ülke seçerek çocukların günlük yaşamı, oyunları, yemekleri, eğitim hayatı veya kültürel özellikleri üzerine araştırma yapabilirler. Sonuçlar “Dünyanın Çocukları” başlıklı sınıf atlasında bir araya getirilebilir. Öğrenciler ayrıca Türkiye ile seçtikleri ülkeyi belirledikleri ölçütler bakımından karşılaştırarak tablo, infografik veya kısa sunum hazırlayabilirler.","okul":"3. Tema - Farklı Dünyalar: “Dünyaya Başka Bir Pencereden Bak” (3 Saat) • Araştırma: Öğrenciler farklı ülkelerin, şehirlerin ve kültürlerin günlük yaşamları; çocuk oyunları, yemekleri, gelenekleri, sanatları ve yaşam biçimleri üzerine araştırma yaparlar. Benzerliklerin yanı sıra farklılıkların da kültürel zenginliğin bir parçası olduğu üzerinde dururlar. Gözlem: Öğrenciler kendi çevrelerindeki kültürel çeşitliliği gözlemlerler. Farklı yörelere ait yemekler, müzikler, kıyafetler, kelimeler, gelenekler veya yaşam biçimlerinden dikkatlerini çeken örnekleri belirlerler. Gözlemlerinde farklılıklara saygılı ve önyargısız bir dil kullanmaya dikkat ederler. • Okuma Etkinlikleri: Tema metinlerinden hareketle farklı yaşamlar, mekânlar, kültürler ve bakış açıları incelenir. Karakterlerin dünyaya bakışları karşılaştırılarak “Aynı olaya farklı insanlar neden farklı bakabilir?”, “Farklılıklarımız bize neler kazandırır?” gibi sorular üzerinde düşünülür. Farklı kültürleri ve yaşamları tanıtan yaş düzeyine uygun metinlerden de yararlanılabilir. • Proje: Öğrenciler seçtikleri bir ülke, şehir, bölge veya kültürü tanıtan “Farklı Dünyalar” çalışması hazırlarlar. Çalışmada yaşam biçimi, gelenekler, çocukların günlük hayatı, sanat, yemek veya oyun gibi başlıklardan yararlanabilirler. Ürün; kültür kartı, gezi rehberi, dergi sayfası, poster, kısa video veya dijital sunum biçiminde hazırlanabilir. • Sosyal Etkinlik: Sınıfta “Farklı Dünyalar Buluşması” düzenlenir. Öğrenciler araştırdıkları kültürleri arkadaşlarına tanıtırlar. Hazırlanan çalışmalar sergilenir ve etkinlik “Farklılıklarımız bizi nasıl zenginleştirir?” sorusu üzerine yapılacak kısa bir sınıf sohbetiyle tamamlanır","gunler":"","saat":8},{"ad":"Çocuklar Neredeyse Okulları Oradadır","tarih":"31 Aralık - 8 Ocak","bas":"2026-12-31","bit":"2027-01-08","aylar":["Aralık","Ocak"],"kazanimlar":[{"kod":"T.D.6.1","metin":"Dinlemede/izlemede materyal seçimini yönetebilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.8","metin":"Dinlediğinin/izlediğinin derin anlamını belirlemeye yönelik üst düzey çıkarımlar yapabilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.9","metin":"Dinlediğini/izlediğini kendi içinde karşılaştırabilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.10","metin":"Dinledikleri/izledikleri arasında karşılaştırma yapabilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.17","metin":"Bilgilendirici metinde düşünceyi geliştirme yollarını belirlemeye berimiz” hazırlanabilir. Öğrencilerin etkili dinleme, empati, yüz yüze iletişim, dijital iletişim ve yanlış anlaşılmaları çözme konusunda geliştirdikleri öneriler bu rehberde toplanabilir.","okul":"24-25-26 MART ÜRETİM ZAMANI YAZMA VE KONUŞMA ETKİNLİKLERİ YAPILACAK. 4.TEMA DEĞERLENDİRME YAPILACAK","gunler":"","saat":8}]},{"tema":"Bilim ve Teknoloji","metinler":[{"ad":"Dünya ve Zaman","tarih":"29 Mart - 6 Nisan","bas":"2027-03-29","bit":"2027-04-06","aylar":["Mart","Nisan"],"kazanimlar":[{"kod":"T.D.6.2","metin":"Dinlemede/izlemede strateji ve yöntem seçimlerini yönetebilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.13","metin":"Öyküleyici metinlerdeki hikâye unsurlarını belirlemeye yönelik çözümleme yapabilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.16","metin":"Metnin bölümlerini belirlemeye yönelik çözümleme yapabilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.18","metin":"Dinlediğindeki/izlediğindeki söz sanatlarını belirlemeye yönelik çözümleme yapabilme","alan":"Dinleme/İzleme"},{"kod":"T.D.6.25","metin":"Dinleme/izleme sürecine yönelik öz yansıtma yapabilme/kendini uyarlayabilme","alan":"Dinleme/İzleme"},{"kod":"T.O.6.3","metin":"Okumada strateji ve yöntem seçimlerini yönetebilme","alan":"Okuma"},{"kod":"T.O.6.14","metin":"Öyküleyici metinlerdeki hikâye unsurlarını belirlemeye yönelik çözümleme yapabilme","alan":"Okuma"},{"kod":"T.O.6.20","metin":"Metindeki söz sanatlarını belirlemeye yönelik çözümleme yapabilme","alan":"Okuma"},{"kod":"T.O.6.27","metin":"Okuma sürecine yönelik öz yansıtma yapabilme/kendini uyarlayabilme","alan":"Okuma"},{"kod":"T.K.6.1","metin":"Konuşma sürecini yönetebilme","alan":"Konuşma"},{"kod":"T.K.6.10","metin":"Sözlü sunum yapabilme","alan":"Konuşma"},{"kod":"T.K.6.11","metin":"Konuşmasında tahminlerinden yararlanabilme","alan":"Konuşma"},{"kod":"T.K.6.23","metin":"Konuşmasında açık ve örtük ifadeleri kullanabilme","alan":"Konuşma"},{"kod":"T.K.6.26","metin":"Konuşma sürecine yönelik öz yansıtma yapabilme/kendini uyarlayabilme","alan":"Konuş let siniflar=oku(ANAHTAR.sinif,null)||JSON.parse(JSON.stringify(AYAR.siniflar));
let secim=oku(ANAHTAR.secim,{sinif:AYAR.siniflar[0].ad,ders:null});
if(!siniflar.some(x=>x.ad===secim.sinif)) secim={sinif:siniflar[0]?.ad,ders:null};
const aktifSinif=()=>siniflar.find(x=>x.ad===secim.sinif)||siniflar[0];
const aktifDers=()=>DERSLER.find(d=>d.id===secim.ders)||DERSLER[0];
const aktifSube=()=>aktifSinif().ad;
const planVar=d=>d.plan&&d.plan.length>0;
function kaydetSecim(){yaz(ANAHTAR.secim,secim);}
const dkey=(d,s,t,m,k)=>[d,s,t,m,k].join("|");

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200);}
function bugunISO(){const n=new Date();return new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,10);}

/* ---------- Gezinme: Sınıf → Ders → Kazanım ---------- */
function git(sinif,ders,gecmis=true){
  secim={sinif,ders:ders||null};kaydetSecim();
  if(gecmis) history.pushState({...secim},"");
  $("#ara").value="";hepsi();window.scrollTo({top:0});
}
window.addEventListener("popstate",e=>{
  const st=e.state||{sinif:secim.sinif,ders:null};
  secim={sinif:st.sinif,ders:st.ders||null};kaydetSecim();$("#ara").value="";hepsi();window.scrollTo({top:0});
});
function cizSiniflar(){
  const k=$("#siniflar");k.innerHTML="";
  siniflar.forEach(x=>{
    const b=document.createElement("button");b.type="button";b.className="sinif-btn";
    b.textContent=x.ad;b.setAttribute("aria-pressed",x.ad===secim.sinif);
    b.onclick=()=>{ if(x.ad===secim.sinif&&!secim.ders) return; git(x.ad,null,!!secim.ders||true); };
    k.appendChild(b);
  });
  const e=document.createElement("button");e.type="button";e.className="sinif-btn sinif-duzenle";
  e.textContent="Düzenle";e.onclick=sinifYonetimi;k.appendChild(e);
}
function cizDersSecim(){
  const sn=aktifSinif(),k=$("#dersSecim");k.innerHTML="";
  if(!sn){k.innerHTML=`<div class="bos" style="margin-top:14px">Henüz sınıf yok. "Düzenle" ile sınıf ekleyin.</div>`;return;}
  if(!sn.dersler.length){k.innerHTML=`<div class="bos" style="margin-top:14px">${esc(sn.ad)} için ders seçilmemiş. "Düzenle" ile ekleyin.</div>`;return;}
  sn.dersler.forEach(id=>{
    const d=DERSLER.find(x=>x.id===id);if(!d) return;
    const b=document.createElement("button");b.type="button";b.className="ders-kart";
    if(!planVar(d)){
      b.classList.add("bekliyor");
      b.innerHTML=`<h2>${esc(d.kisaAd||d.ad)}<span>›</span></h2><div class="hafta">Yıllık plan henüz yüklenmedi.</div>`;
      b.onclick=()=>toast("Bu dersin planı eklenince kazanımlar burada görünecek.");
    }else{
      let top=0,is=0;d.plan.forEach(t=>t.metinler.forEach(m=>{top+=m.kazanimlar.length;is+=sayac(d,sn.ad,t,m);}));
      const y=top?Math.round(is/top*100):0,x=buHaftaBul(d);
      const hafta=x?`<div class="hafta"><em>${x.durum==="simdi"?"Bu hafta":"Sıradaki"}:</em> ${esc(d.birim==="hafta"?x.m.kazanimlar[0].metin:x.m.ad)} <span style="color:var(--ink-soft)">(${esc(x.m.tarih)})</span></div>`:"";
      b.innerHTML=`<h2>${esc(d.kisaAd||d.ad)}<span>›</span></h2>${hafta}<div class="ilerleme"><div class="bar"><i style="width:${y}%"></i></div><span>${is}/${top}</span></div>`;
      b.onclick=()=>git(sn.ad,d.id);
    }
    k.appendChild(b);
  });
}
/* ---------- Bu hafta ---------- */
function buHaftaBul(d){
  const bugun=bugunISO();let simdi=null,sonraki=null;
  d.plan.forEach(t=>t.metinler.forEach(m=>{
    if(!m.bas) return;
    if(m.bas<=bugun&&bugun<=m.bit&&!simdi) simdi={t,m};
    if(m.bas>bugun&&(!sonraki||m.bas<sonraki.m.bas)) sonraki={t,m};
  }));
  return simdi?{...simdi,durum:"simdi"}:(sonraki?{...sonraki,durum:"sonraki"}:null);
}
function cizBuHafta(){
  const d=aktifDers(),b=$("#buHafta"),x=buHaftaBul(d);
  if(!x){b.classList.add("hidden");return;}
  b.classList.remove("hidden");
  const birim=d.birim==="hafta"?x.m.kazanimlar[0].kod+" "+x.m.kazanimlar[0].metin:x.m.ad;
  b.innerHTML=`<div><div class="etiket">${x.durum==="simdi"?"Bu hafta":"Sıradaki"}</div>
    <div class="ad">${esc(birim)}</div><div class="alt">${esc(x.t.tema)} · ${esc(x.m.tarih)}</div></div><span class="git" aria-hidden="true">›</span>`;
  b.onclick=()=>{
    const el=document.querySelector(`[data-mid="${CSS.escape(x.t.tema+"||"+x.m.ad)}"]`);
    if(!el) return;
    el.closest(".tema").classList.add("open");el.classList.add("open");
    const y=el.getBoundingClientRect().top+window.scrollY-$(".ust").offsetHeight-8;window.scrollTo({top:y,behavior:"smooth"});
  };
}

function cizDuyurular(){
  const bugun=bugunISO(),kok=$("#duyurular");kok.innerHTML="";
  DUYURULAR.forEach(([a,z,y])=>{
    const fark=(new Date(a)-new Date(bugun))/864e5;
    if((bugun>=a&&bugun<=z)||(fark>0&&fark<=10)) kok.innerHTML+=`<div class="duyuru">${esc(y)}</div>`;
  });
}
/* ---------- İlerleme ---------- */
function sayac(d,s,t,m){let n=0;m.kazanimlar.forEach(k=>{const r=degerlendirme[dkey(d.id,s,t.tema,m.ad,k.kod)];if(r&&r.islendi)n++;});return n;}
function cizIlerleme(){
  const d=aktifDers(),s=aktifSube();let top=0,is=0;
  d.plan.forEach(t=>t.metinler.forEach(m=>{top+=m.kazanimlar.length;is+=sayac(d,s,t,m);}));
  const y=top?Math.round(is/top*100):0;
  $("#ilerleme").innerHTML=`<span>${esc(s)}</span><div class="bar"><i style="width:${y}%"></i></div><span>${is}/${top}</span>`;
}

/* ---------- Liste ---------- */
function ciz(){
  const d=aktifDers(),s=aktifSube(),f=$("#ara").value.trim().toLocaleLowerCase("tr"),bugun=bugunISO();
  const acikTemalar=new Set([...document.querySelectorAll(".tema.open")].map(x=>x.dataset.tema));
  const acikMetinler=new Set([...document.querySelectorAll(".metin.open")].map(x=>x.dataset.mid));
  const kok=$("#liste");kok.innerHTML="";let say=0;
  d.plan.forEach(t=>{
    const metinler=t.metinler.filter(m=>!f||t.tema.toLocaleLowerCase("tr").includes(f)||m.ad.toLocaleLowerCase("tr").includes(f)
      ||m.kazanimlar.some(k=>(k.kod+" "+k.metin).toLocaleLowerCase("tr").includes(f)));
    if(!metinler.length) return; say++;
    const kart=document.createElement("section");kart.className="tema";kart.dataset.tema=t.tema;
    if(f||acikTemalar.has(t.tema)) kart.classList.add("open");
    const toplam=t.metinler.reduce((a,m)=>a+m.kazanimlar.length,0),islenen=t.metinler.reduce((a,m)=>a+sayac(d,s,t,m),0);
    kart.innerHTML=`<button class="tema-head" type="button"><span class="chev">▶</span><h2>${esc(t.tema)}</h2><span class="badge">${islenen}/${toplam}</span></button><div class="tema-body"></div>`;
    kart.querySelector(".tema-head").onclick=()=>kart.classList.toggle("open");
    const govde=kart.querySelector(".tema-body");
    metinler.forEach(m=>govde.appendChild(metinKarti(d,s,t,m,f,acikMetinler,bugun)));
    kok.appendChild(kart);
  });
  if(!say) kok.innerHTML=`<div class="bos">"${esc(f)}" için sonuç yok. Aramayı kısaltın ya da kodu T.O.7.8 biçiminde yazın.</div>`;
}
function metinKarti(d,s,t,m,f,acikMetinler,bugun){
  const mid=t.tema+"||"+m.ad;
  const md=document.createElement("div");md.className="metin";md.dataset.mid=mid;
  if(f||acikMetinler.has(mid)) md.classList.add("open");
  if(m.bas&&m.bas<=bugun&&bugun<=m.bit) md.classList.add("simdi");
  else if(m.bit&&m.bit<bugun) md.classList.add("gecti");
  const alt=d.birim==="hafta"?`<small>${esc(m.kazanimlar[0].kod)} ${esc(m.kazanimlar[0].metin)}</small>`:(m.dinleme?`<small>Dinleme/İzleme metni</small>`:"");
  const n=sayac(d,s,t,m);
  md.innerHTML=`<button class="metin-head" type="button"><span class="chev">▶</span><span class="ad">${esc(m.ad)}${alt}</span>
    <span class="sayac">${d.birim==="hafta"?(n?"✓":""):n+"/"+m.kazanimlar.length}</span><span class="tarih">${esc(m.tarih||"tarih yok")}</span></button><div class="metin-body"></div>`;
  md.querySelector(".metin-head").onclick=()=>md.classList.toggle("open");
  const mb=md.querySelector(".metin-body");

  const ey=document.createElement("div");ey.className="eylemler";
  if(d.birim!=="hafta"){
    const tum=document.createElement("button");tum.type="button";tum.className="eylem dolu";
    const hepsiIslendi=()=>m.kazanimlar.every(k=>(degerlendirme[dkey(d.id,s,t.tema,m.ad,k.kod)]||{}).islendi);
    tum.textContent=hepsiIslendi()?"İşaretleri kaldır":"Tümünü işlendi say";
    tum.onclick=()=>{
      const kaldir=hepsiIslendi();
      m.kazanimlar.forEach(k=>{const key=dkey(d.id,s,t.tema,m.ad,k.kod),r=degerlendirme[key]||{seviye:"İyi"};degerlendirme[key]={islendi:!kaldir,seviye:r.seviye||"İyi"};});
      yaz(ANAHTAR.deg,degerlendirme);ciz();cizIlerleme();toast(kaldir?"İşaretler kaldırıldı":`${m.kazanimlar.length} kazanım "İyi" olarak işaretlendi`);
    };
    ey.appendChild(tum);
  }
  const kop=document.createElement("button");kop.type="button";kop.className="eylem";kop.textContent="Deftere kopyala";
  kop.onclick=()=>kopyala(d,t,m);ey.appendChild(kop);
  mb.appendChild(ey);

  const alanlar=new Map();
  m.kazanimlar.forEach(k=>{if(!alanlar.has(k.alan)) alanlar.set(k.alan,[]);alanlar.get(k.alan).push(k);});
  alanlar.forEach((liste,alan)=>{
    const a=document.createElement("div");a.className="alan";
    if(d.birim!=="hafta") a.innerHTML=`<h4>${esc(alan)}</h4>`;
    liste.forEach(k=>a.appendChild(kazSatiri(d,s,t,m,k,md)));
    mb.appendChild(a);
  });

  const ek=[];
  if(m.aciklama) ek.push(["Açıklama",m.aciklama]);
  if(m.okul) ek.push(["Okul temelli planlama / Üretim zamanı",m.okul]);
  if(m.gunler) ek.push(["Belirli gün ve haftalar",m.gunler]);
  if(m.kanit) ek.push(["Öğrenme kanıtları",m.kanit]);
  if(m.degerler) ek.push(["Değerler",m.degerler]);
  if(m.farklilastirma) ek.push(["Farklılaştırma",m.farklilastirma.replace(/\s*(Destekleme:|Zenginleştirme:)/g,"\n$1")]);
  if(m.okul&&/ÜRETİM ZAMANI|TATİL|SINAV/i.test(m.okul)){
    const nt=document.createElement("div");nt.className="not";nt.textContent=m.okul.length>140?m.okul.slice(0,140)+"…":m.okul;mb.appendChild(nt);
  }
  if(ek.length){
    const det=document.createElement("details");det.className="ek";
    det.innerHTML=`<summary>Plandaki ayrıntılar</summary>`+ek.map(([b,p])=>`<div class="ek-blok"><b>${esc(b)}</b><p>${esc(p)}</p></div>`).join("");
    mb.appendChild(det);
  }
  return md;
}
function kazSatiri(d,s,t,m,k,md){
  const key=dkey(d.id,s,t.tema,m.ad,k.kod);
  const kd=document.createElement("div");kd.className="kaz";
  const guncelle=()=>{
    const r=degerlendirme[key]||{islendi:false,seviye:"İyi"};
    kd.classList.toggle("islendi",!!r.islendi);
    kd.querySelector(".kutu").textContent=r.islendi?"✓":"";
    kd.querySelectorAll(".dz").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===r.seviye));
    kd.querySelector(".kaz-ust").setAttribute("aria-pressed",!!r.islendi);
  };
  kd.innerHTML=`<button class="kaz-ust" type="button"><span class="kutu" aria-hidden="true"></span><span><span class="kod">${esc(k.kod)}</span>${esc(k.metin)}</span></button>
    <div class="duzey">${SEVIYELER.map(v=>`<button type="button" class="dz" data-v="${v}">${v}</button>`).join("")}</div>`;
  kd.querySelector(".kaz-ust").onclick=()=>{
    const r=degerlendirme[key]||{islendi:false,seviye:"İyi"};
    degerlendirme[key]={islendi:!r.islendi,seviye:r.seviye||"İyi"};yaz(ANAHTAR.deg,degerlendirme);
    guncelle();metinSayacGuncelle(d,s,t,m,md);cizIlerleme();
  };
  kd.querySelectorAll(".dz").forEach(b=>b.onclick=()=>{
    degerlendirme[key]={islendi:true,seviye:b.dataset.v};yaz(ANAHTAR.deg,degerlendirme);guncelle();
  });
  guncelle();return kd;
}
function metinSayacGuncelle(d,s,t,m,md){
  const n=sayac(d,s,t,m);md.querySelector(".sayac").textContent=d.birim==="hafta"?(n?"✓":""):n+"/"+m.kazanimlar.length;
  const kart=md.closest(".tema");
  const toplam=t.metinler.reduce((a,x)=>a+x.kazanimlar.length,0),is=t.metinler.reduce((a,x)=>a+sayac(d,s,t,x),0);
  kart.querySelector(".badge").textContent=is+"/"+toplam;
  const tb=md.querySelector(".eylem.dolu");
  if(tb) tb.textContent=m.kazanimlar.every(k=>(degerlendirme[dkey(d.id,s,t.tema,m.ad,k.kod)]||{}).islendi)?"İşaretleri kaldır":"Tümünü işlendi say";
}
function kopyala(d,t,m){
  let s=`Tarih: ${m.tarih}\n${d.birim==="hafta"?"Ünite":"Tema"}: ${t.tema}\n`;
  if(d.birim!=="hafta") s+=`Metin: ${m.ad}\n`;
  s+=`Kazanımlar:\n`;m.kazanimlar.forEach(k=>{s+=`• ${k.kod} ${k.metin}\n`;});
  const bitti=()=>toast("Defter metni kopyalandı ✓");
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(s).then(bitti).catch(()=>yedekKopya(s,bitti));
  else yedekKopya(s,bitti);
}
function yedekKopya(s,cb){const ta=document.createElement("textarea");ta.value=s;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");cb();}catch(e){toast("Kopyalanamadı");}ta.remove();}

/* ---------- Şube yönetimi ---------- */
function perde(icerik){
  const k=$("#perdeKok");k.innerHTML=`<div class="perde"><div class="sayfa" role="dialog" aria-modal="true">${icerik}</div></div>`;
  const p=k.querySelector(".perde");p.onclick=e=>{if(e.target===p) kapat();};
  return k.querySelector(".sayfa");
}
function kapat(){$("#perdeKok").innerHTML="";}
function sinifYonetimi(){
  const s=perde(`<h3>Sınıflarım ve derslerim</h3><div id="sinifListe"></div>
    <div class="alt-row"><input id="yeniSinif" placeholder="Yeni sınıf, örn. 8/A" maxlength="12"><button class="ana-btn" id="sinifEkleBtn" type="button" style="flex:0 0 auto">Ekle</button></div>
    <div class="alt-row"><button class="ikinci-btn" type="button" id="kapatBtn">Tamam</button></div>`);
  const kaydet=()=>{yaz(ANAHTAR.sinif,siniflar);};
  const liste=()=>{
    const k=s.querySelector("#sinifListe");k.innerHTML="";
    siniflar.forEach(sn=>{
      const g=document.createElement("div");g.className="sinif-grup";
      g.innerHTML=`<div class="ust-satir"><span>${esc(sn.ad)}</span></div>`;
      const sil=document.createElement("button");sil.type="button";sil.className="sil-btn";sil.textContent="Sil";
      sil.onclick=()=>{
        if(!confirm(`${sn.ad} sınıfı ve bu sınıfa ait tüm işaretlemeler silinsin mi?`)) return;
        siniflar=siniflar.filter(x=>x!==sn);
        Object.keys(degerlendirme).forEach(key=>{if(key.split("|")[1]===sn.ad) delete degerlendirme[key];});
        yaz(ANAHTAR.deg,degerlendirme);kaydet();
        if(secim.sinif===sn.ad) secim={sinif:siniflar[0]?.ad,ders:null};
        kaydetSecim();liste();hepsi();
      };
      g.querySelector(".ust-satir").appendChild(sil);
      const sev=sn.ad.match(/^\d+/)?.[0];
      DERSLER.filter(d=>!sev||d.sinif===sev).forEach(d=>{
        const l=document.createElement("label");l.className="sec-satir";
        l.innerHTML=`<input type="checkbox" ${sn.dersler.includes(d.id)?"checked":""}><span>${esc(d.ad)}${planVar(d)?"":" (plan bekleniyor)"}</span>`;
        l.querySelector("input").onchange=e=>{
          if(e.target.checked) sn.dersler=DERSLER.map(x=>x.id).filter(id=>id===d.id||sn.dersler.includes(id));
          else sn.dersler=sn.dersler.filter(x=>x!==d.id);
          kaydet();hepsi();
        };
        g.appendChild(l);
      });
      k.appendChild(g);
    });
  };
  liste();
  const ekle=()=>{
    const v=s.querySelector("#yeniSinif").value.trim().toLocaleUpperCase("tr").replace(/\s+/g,"");
    if(!/^\d+\/?[A-ZÇĞİÖŞÜ]$/.test(v)){toast("Sınıfı 7/A biçiminde yazın");return;}
    const ad=v.includes("/")?v:v.replace(/(\d+)/,"$1/");
    if(siniflar.some(x=>x.ad===ad)){toast(ad+" zaten ekli");return;}
    siniflar.push({ad,dersler:[]});siniflar.sort((a,b)=>a.ad.localeCompare(b.ad,"tr",{numeric:true}));
    kaydet();s.querySelector("#yeniSinif").value="";liste();hepsi();toast(ad+" eklendi, derslerini işaretleyin");
  };
  s.querySelector("#sinifEkleBtn").onclick=ekle;
  s.querySelector("#yeniSinif").onkeydown=e=>{if(e.key==="Enter") ekle();};
  s.querySelector("#kapatBtn").onclick=kapat;
}

/* ---------- Aylık rapor ---------- */
function aydakiMetinler(d,ay){const r=[];d.plan.forEach(t=>t.metinler.forEach(m=>{if((m.aylar||[]).includes(ay)) r.push({t,m});}));return r;}
function cizAyGrid(){
  const d=aktifDers(),s=aktifSube(),k=$("#ayGrid");k.innerHTML="";
  $("#raporAciklama").textContent=`Rapor ${s} şubesinin işaretlemelerinden hazırlanır. Ay bitince ilgili aya dokunun.`;
  AY_SIRA.forEach(ay=>{
    const liste=aydakiMetinler(d,ay);if(!liste.length) return;
    let is=0;liste.forEach(({t,m})=>is+=sayac(d,s,t,m));
    const b=document.createElement("button");b.type="button";b.className="ay-btn";
    b.innerHTML=`${ay}<span class="sayi">${liste.length} ${d.birim==="hafta"?"hafta":"metin"} · ${is} ✓</span>`;
    b.onclick=()=>raporOlustur(ay);k.appendChild(b);
  });
}
function alanBasariCumlesi(alan,puanlar,unite){
  const ne=unite?"ünitede":"dil becerisi alanında";
  if(!puanlar.length) return `Bu ay ${alan.toLocaleLowerCase("tr")} ${unite?"ünitesinde":"alanında"} değerlendirme işaretlenmediği için veri bulunmamaktadır.`;
  const ort=Math.round(puanlar.reduce((a,b)=>a+b,0)/puanlar.length/5)*5;
  if(ort>=85) return `Sınıfımız genel anlamda bu ${ne} %${ort} oranında istenilen düzeyde olduğu gözlemlenmiştir.`;
  if(ort>=60) return `Sınıfımız bu ${ne} %${ort} oranında istenilen düzeyde olup bazı öğrencilerde eksiklikler görülmektedir. Bu durumla ilgili ek çalışmalar planlanmaktadır.`;
  return `Sınıfımız bu ${ne} %${ort} oranında istenilen düzeydedir. Bu alan öğrencilerimizin en çok desteğe ihtiyaç duyduğu alan olup ek çalışmalar gerekmektedir.`;
}
async function raporOlustur(ay){
  const d=aktifDers(),s=aktifSube(),unite=d.birim==="hafta";
  const kazMap=new Map(),alanPuan={};d.alanlar.forEach(a=>alanPuan[a]=[]);
  aydakiMetinler(d,ay).forEach(({t,m})=>m.kazanimlar.forEach(k=>{
    const r=degerlendirme[dkey(d.id,s,t.tema,m.ad,k.kod)];
    if(r&&r.islendi){
      if(!kazMap.has(k.kod)) kazMap.set(k.kod,k);
      if(alanPuan[k.alan]&&SEVIYE_PUAN[r.seviye]!=null) alanPuan[k.alan].push(SEVIYE_PUAN[r.seviye]);
    }
  }));
  if(!kazMap.size){toast(`${s} için ${ay} ayında işlenen kazanım işaretlenmemiş`);return;}
  if(!window.docx){toast("Word oluşturucu yüklenemedi. İnternete bağlanıp sayfayı yenileyin.");return;}
  const {Document,Paragraph,TextRun,Packer,AlignmentType}=window.docx;
  const P=(text,o={})=>new Paragraph({spacing:{after:o.after??60,before:o.before??0},alignment:o.center?AlignmentType.CENTER:undefined,bullet:o.bullet?{level:0}:undefined,
    children:Array.isArray(text)?text:[new TextRun({text,bold:!!o.bold,size:o.size})]});
  const c=[];
  c.push(P(`${EGITIM_YILI} EĞİTİM ÖĞRETİM YILI ${OKUL_AD.toLocaleUpperCase("tr")} ${s} SINIFI ${d.dersAd} DERSİ MAARİF MODELİ ${ay.toLocaleUpperCase("tr")} AYI DEĞERLENDİRME RAPORU`,{bold:true,size:26,center:true,after:300}));
  c.push(P(unite?"Kazanımlar":"Öğrenme Çıktıları ve Süreç Bileşenleri",{bold:true,size:24,after:120}));
  d.alanlar.forEach(alan=>{
    const l=[...kazMap.values()].filter(k=>k.alan===alan);if(!l.length) return;
    c.push(P(alan,{bold:true,before:100}));
    l.forEach(k=>c.push(P(`${k.kod}. ${k.metin.replace(/\.$/,"")}`,{after:40})));
  });
  const bolum=(b,maddeler)=>{c.push(P(b,{bold:true,size:24,before:220,after:80}));maddeler.forEach(m=>c.push(P(m,{bullet:true})));};
  bolum("Etkinlik İzleme:",[
    "Öğrencilerin bireysel ve grup çalışmalarındaki etkinliklere katılımı gözlemlenmiş ve kayıt altına alınmıştır.",
    "Grup çalışmalarında liderlik, sorumluluk paylaşımı ve iş birliği becerileri değerlendirilmiştir.",
    "Bireysel çalışmalarda görevlerin tamamlanma düzeyi ve özgün fikir üretme kapasitesi izlenmiştir.",
    "Öne çıkan öğrenciler belirlenmiş, bu öğrenciler için zenginleştirme etkinlikleri planlanmıştır."]);
  const ort=a=>alanPuan[a].length?alanPuan[a].reduce((x,y)=>x+y,0)/alanPuan[a].length:null;
  const sirali=d.alanlar.map(a=>({alan:a,ort:ort(a)})).filter(x=>x.ort!==null);
  const zayif=sirali.length?sirali.reduce((a,b)=>a.ort<b.ort?a:b):null,guclu=sirali.length?sirali.reduce((a,b)=>a.ort>b.ort?a:b):null;
  const gel=unite?["Öğrencilerin masal ve destan türlerine yönelik bilgi kaynaklarına ulaşma ve bunları etkili kullanma becerileri desteklenmiştir.","Sınıf içi anlatım, canlandırma ve paylaşım etkinlikleri sürdürülmüştür."]
    :["Öğrencilerin konuyla ilgili bilgi kaynaklarına ulaşma ve bunları etkili kullanma becerileri desteklenmiştir.","Sınıf içi etkinliklerle dinleme ve konuşma becerilerinin geliştirilmesine yönelik çalışmalar sürdürülmüştür."];
  if(zayif&&sirali.length>1) gel.push(`${zayif.alan} ${unite?"ünitesinde":"alanında"} görülen eksikliklerin giderilmesi için ek çalışmalar yapılmaktadır.`);
  bolum("Gelişim Alanları:",gel);
  c.push(P("Genel Sonuç:",{bold:true,size:24,before:220}));
  c.push(P(zayif&&sirali.length>1?`Öğrenciler genel anlamda kazanımların büyük bölümüne ulaşmıştır. ${zayif.alan} ${unite?"ünitesinde":"alanında"} istenilen düzeyin altında kalan öğrenciler için ek destek çalışmaları planlanmaktadır.`
    :"Öğrenciler bu ay işlenen kazanımların büyük bölümüne ulaşmıştır. Değerlendirme sonuçlarına göre gerekli destek çalışmaları sürdürülecektir."));
  bolum("Stratejik Yaklaşımlar:",[
    "Türkiye Yüzyılı Maarif Modeli'nin öne çıkardığı değerler eğitimi (Adalet, Çalışkanlık, Dürüstlük, Estetik, Mahremiyet, Sorumluluk, Vatanseverlik, Yardımseverlik) grup etkinlikleri ve örnek metinlerle işlenmiştir.",
    "Problem çözme odaklı çalışmalarla öğrencilerin bir sorun karşısında farklı çözüm yolları üretme becerileri değerlendirilmiştir.",
    "Grup etkinliklerinde bireysel katkılar ve ekip başarısı gözlemlenmiştir."]);
  c.push(P("Sonuçlar:",{bold:true,size:24,before:220,after:80}));
  const gosterilen=unite?d.alanlar.filter(a=>alanPuan[a].length):d.alanlar;
  gosterilen.forEach((alan,i)=>{
    const ad=unite?`${alan} Ünitesi`:`${alan==="Dinleme/İzleme"?"Dinleme":alan} Dil Becerisi`;
    c.push(P(`${i+1}. ${ad}`,{bold:true,before:120}));
    c.push(P([new TextRun({text:"Başarı Durumu: ",bold:true}),new TextRun({text:alanBasariCumlesi(alan,alanPuan[alan],unite)})],{bullet:true,after:40}));
  });
  c.push(P("Sonuç:",{bold:true,size:24,before:220}));
  c.push(P(guclu&&zayif&&guclu.alan!==zayif.alan?`Öğrencilerin kazanımların büyük kısmına ulaştığı, ${guclu.alan} ${unite?"ünitesinde":"alanında"} güçlü olduğu, ${zayif.alan} ${unite?"ünitesinde":"alanında"} ise desteklenmesi gerektiği görülmüştür. Bu doğrultuda çalışmalar planlanarak sürdürülecektir.`
    :"Öğrencilerin bu ay işlenen kazanımların büyük kısmına ulaştığı gözlemlenmiştir. Değerlendirme sonuçlarına göre gerekli destek çalışmaları sürdürülecektir.",{after:400}));
  c.push(P(OGRETMEN_AD,{bold:true,after:20}));c.push(P(OGRETMEN_UNVAN,{bold:true,after:200}));
  c.push(P(MUDUR_AD,{bold:true,after:20}));c.push(P(MUDUR_UNVAN,{bold:true}));
  toast(`${ay} raporu hazırlanıyor...`);
  try{
    const blob=await Packer.toBlob(new Document({sections:[{children:c}]}));
    const ad=`${EGITIM_YILI}_${ay}_${s.replace("/","-")}_${d.birim==="hafta"?"Masal_ve_Destanlarimiz":"Turkce"}_Maarif_Raporu.docx`;
    dosyaVer(blob,ad,`${ay} raporu`);
  }catch(e){console.error(e);toast("Rapor oluşturulamadı, tekrar deneyin.");}
}
function dosyaVer(blob,ad,etiket){
  const file=new File([blob],ad,{type:blob.type||"application/octet-stream"});
  const paylasilir=navigator.canShare&&navigator.canShare({files:[file]});
  const indir=()=>{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=ad;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast(`${etiket} indirildi ✓`);kapat();};
  if(!paylasilir){indir();return;}
  const s=perde(`<h3>${esc(etiket)} hazır</h3><p style="font-size:.85rem;color:var(--ink-soft)">${esc(ad)}</p>
    <div class="alt-row"><button class="ana-btn" id="paylasBtn" type="button">Paylaş / Drive'a kaydet</button></div>
    <div class="alt-row"><button class="ikinci-btn" id="indirBtn" type="button">Telefona indir</button></div>`);
  s.querySelector("#indirBtn").onclick=indir;
  s.querySelector("#paylasBtn").onclick=()=>navigator.share({files:[file],title:ad}).then(kapat).catch(()=>{});
}

/* ---------- Yedek ---------- */
$("#yedekAl").onclick=()=>{
  const veri={surum:2,yil:EGITIM_YILI,tarih:new Date().toISOString(),degerlendirme,siniflar};
  dosyaVer(new Blob([JSON.stringify(veri)],{type:"application/json"}),`kazanim-defteri-yedek-${bugunISO()}.json`,"Yedek");
};
$("#yedekYukle").onclick=()=>$("#yedekDosya").click();
$("#yedekDosya").onchange=async e=>{
  const f=e.target.files[0];if(!f) return;
  try{
    const v=JSON.parse(await f.text());
    if(!v.degerlendirme) throw 0;
    if(!confirm("Yedekteki kayıtlar bu cihazdakilerle birleştirilecek. Devam edilsin mi?")) return;
    Object.assign(degerlendirme,v.degerlendirme);
    (v.siniflar||[]).forEach(y=>{const m=siniflar.find(x=>x.ad===y.ad);if(m) m.dersler=[...new Set([...m.dersler,...y.dersler])];else siniflar.push(y);});
    yaz(ANAHTAR.deg,degerlendirme);yaz(ANAHTAR.sinif,siniflar);hepsi();toast("Yedek yüklendi ✓");
  }catch(err){toast("Bu dosya Kazanım Defteri yedeği değil.");}
  e.target.value="";
};

/* ---------- Genel ---------- */
$("#ara").oninput=()=>ciz();
$("#hepsiniAc").onclick=()=>{
  const acik=document.querySelector(".tema.open");
  document.querySelectorAll(".tema").forEach(x=>x.classList.toggle("open",!acik));
  $("#hepsiniAc").textContent=acik?"Aç":"Kapat";
};
function hepsi(){
  cizSiniflar();
  const dersModu=!!secim.ders&&aktifSinif()&&aktifSinif().dersler.includes(secim.ders)&&planVar(aktifDers());
  if(!dersModu) secim.ders=null;
  $("#dersSecim").classList.toggle("hidden",dersModu);
  $("#dersEkran").classList.toggle("hidden",!dersModu);
  $("#dersBaslik").classList.toggle("hidden",!dersModu);
  $("#aramaSatir").classList.toggle("hidden",!dersModu);
  cizDuyurular();
  if(!dersModu){cizDersSecim();return;}
  const d=aktifDers();
  $("#dersAd").textContent=d.kisaAd||d.ad;$("#dersAlt").textContent=aktifSube()+" sınıfı";
  cizBuHafta();cizIlerleme();ciz();cizAyGrid();
}
$("#geri").onclick=()=>{ if(history.state&&history.state.ders) history.back(); else git(secim.sinif,null,false); };
history.replaceState({...secim},"");
$("#ogrAd").textContent=OGRETMEN_AD;
hepsi();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
